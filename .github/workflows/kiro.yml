name: Kiro AI Assistant

on:
  # Manual trigger for testing
  workflow_dispatch:

  # Mode 1: COMMENT — post "@kiro <instruction>" on any issue or PR
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

  # Mode 2: LABEL — add the "kiro" label to an issue or PR
  # Mode 2b: ASSIGN — assign an issue or PR to the "kirocli" GitHub user (legacy)
  issues:
    types: [assigned, labeled]
  pull_request:
    types: [assigned, labeled]

  # Mode 3: AUTO — runs every Monday at 9 AM UTC with an explicit prompt
  schedule:
    - cron: '0 9 * * 1'

  # Mode 3: AUTO — also runs on push to main (scoped to src/ to avoid loops on kiro/ branches)
  push:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  kiro:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Kiro
        uses: karancode/kiro-action@fix/checkout-pr-branch-before-kiro
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: '/kiro'
          label_trigger: 'kiro'
          assignee_trigger: 'kirocli'
          branch_prefix: 'kiro/'
